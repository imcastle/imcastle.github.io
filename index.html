<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作職責排班系統 (雙班表版)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7c7cc; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- 圖示元件 ---
    const IconCalendar = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const IconUsers = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const IconSettings = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
    const IconCheckCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconBarChart3 = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><rect width="4" height="7" x="7" y="10" rx="1"/><rect width="4" height="12" x="15" y="5" rx="1"/></svg>;
    const IconRefreshCw = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
    const IconCheckSquare = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>;
    const IconX = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconTrash = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
    const IconUserPlus = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>;
    const IconList = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
    const IconClock = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconDatabase = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>;
    const IconTrendingUp = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
    const IconChevronUp = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>;
    const IconChevronDown = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>;
    const IconDownload = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IconImage = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
    const IconMoon = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
    const IconSun = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;

    // --- 主程式 ---
    function ShiftSchedulerApp() {
      // 預設員工池
      const initialPool = [
        { id: 'A', name: '同仁 A', roles: { m: true, p: true, g: true, ct: true, f: true } },
        { id: 'B', name: '同仁 B', roles: { m: true, p: true, g: true, ct: true, f: true } },
        { id: 'C', name: '同仁 C', roles: { m: true, p: true, g: true, ct: true, f: true } },
        { id: 'D', name: '同仁 D', roles: { m: true, p: true, g: true, ct: true, f: true } },
        { id: 'E', name: '同仁 E', roles: { m: true, p: true, g: true, ct: true, f: true } },
        { id: 'F', name: '同仁 F', roles: { m: true, p: true, g: true, ct: false, f: true } },
      ];

      const [employeePool, setEmployeePool] = useState(() => {
        try {
          const saved = localStorage.getItem('ShiftScheduler_employeePool');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return initialPool;
      });

      const [currentDate, setCurrentDate] = useState(() => {
        try {
          const savedDate = localStorage.getItem('ShiftScheduler_currentDate');
          if (savedDate) return savedDate;
        } catch (e) {}
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      });

      const year = parseInt(currentDate.split('-')[0]);
      const month = parseInt(currentDate.split('-')[1]);
      const daysInMonth = new Date(year, month, 0).getDate();

      // 班別狀態：'evening' (小夜班) | 'night' (大夜班)
      const [shiftType, setShiftType] = useState('evening');

      const [activeEmployeeIds, setActiveEmployeeIds] = useState([]);
      
      // 將排班資料改為雙層結構：{ evening: {...}, night: {...} }
      const [schedule, setSchedule] = useState({ evening: {}, night: {} });
      const [lockedAssignments, setLockedAssignments] = useState({ evening: {}, night: {} });
      const [assignments, setAssignments] = useState({ evening: {}, night: {} });
      const [stats, setStats] = useState({ evening: {}, night: {} });

      const [activeTab, setActiveTab] = useState('pool');
      const [newEmpName, setNewEmpName] = useState('');
      
      const [bonusModalEmpId, setBonusModalEmpId] = useState(null);
      const [multiBonusModalEmpId, setMultiBonusModalEmpId] = useState(null);
      
      // 跨月統計狀態
      const [multiStartMonth, setMultiStartMonth] = useState(`${year}-01`);
      const [multiEndMonth, setMultiEndMonth] = useState(currentDate);
      const [multiStats, setMultiStats] = useState({});
      
      // 圖片匯出用的 Refs
      const scheduleTableRef = useRef(null);
      const statsTableRef = useRef(null);

      useEffect(() => {
        try { localStorage.setItem('ShiftScheduler_employeePool', JSON.stringify(employeePool)); } catch (e) {}
      }, [employeePool]);

      useEffect(() => {
        try {
          localStorage.setItem('ShiftScheduler_currentDate', currentDate);
          const savedData = localStorage.getItem(`ShiftScheduler_data_${currentDate}`);
          
          const initialEmpty = {};
          for (let i = 1; i <= daysInMonth; i++) initialEmpty[i] = [];

          if (savedData) {
            const parsed = JSON.parse(savedData);
            
            // 相容舊資料 (舊資料沒有 evening/night 屬性)
            const isOldFormat = !parsed.schedule?.evening && !parsed.schedule?.night;
            
            if (isOldFormat) {
              setSchedule({ evening: parsed.schedule || initialEmpty, night: initialEmpty });
              setLockedAssignments({ evening: parsed.lockedAssignments || {}, night: {} });
              setAssignments({ evening: parsed.assignments || {}, night: {} });
              setStats({ evening: parsed.stats || {}, night: {} });
            } else {
              setSchedule({
                evening: parsed.schedule?.evening || initialEmpty,
                night: parsed.schedule?.night || initialEmpty
              });
              setLockedAssignments({
                evening: parsed.lockedAssignments?.evening || {},
                night: parsed.lockedAssignments?.night || {}
              });
              setAssignments({
                evening: parsed.assignments?.evening || {},
                night: parsed.assignments?.night || {}
              });
              setStats({
                evening: parsed.stats?.evening || {},
                night: parsed.stats?.night || {}
              });
            }

            if (parsed.activeEmployeeIds && parsed.activeEmployeeIds.length <= 6) {
              setActiveEmployeeIds(parsed.activeEmployeeIds);
            } else {
              setActiveEmployeeIds(employeePool.slice(0, 6).map(e => e.id));
            }
            return;
          }
          
          // 若無資料，初始化空白
          setSchedule({ evening: initialEmpty, night: initialEmpty });
          setLockedAssignments({ evening: {}, night: {} });
          setAssignments({ evening: {}, night: {} });
          setStats({ evening: {}, night: {} });
          setActiveEmployeeIds(employeePool.slice(0, 6).map(e => e.id));
          
        } catch (e) {}
      }, [currentDate, daysInMonth]);

      // 自動儲存當月資料
      useEffect(() => {
        if (activeEmployeeIds.length > 0) {
          try {
            const dataToSave = { schedule, lockedAssignments, assignments, stats, activeEmployeeIds };
            localStorage.setItem(`ShiftScheduler_data_${currentDate}`, JSON.stringify(dataToSave));
          } catch (e) {}
        }
      }, [schedule, lockedAssignments, assignments, stats, activeEmployeeIds, currentDate]);

      const activeEmployees = useMemo(() => {
        return activeEmployeeIds.map(id => employeePool.find(e => e.id === id)).filter(Boolean);
      }, [activeEmployeeIds, employeePool]);

      const handleMonthChange = (e) => setCurrentDate(e.target.value);
      const getDayOfWeekIndex = (y, m, day) => new Date(y, m - 1, day).getDay();
      const getDayOfWeek = (y, m, day) => ['日', '一', '二', '三', '四', '五', '六'][getDayOfWeekIndex(y, m, day)];
      const isWeekend = (y, m, day) => getDayOfWeekIndex(y, m, day) === 0 || getDayOfWeekIndex(y, m, day) === 6;

      // 職責加給計算 (根據班別區分)
      const getRoleBonusHours = (role, sType) => {
        if (sType === 'evening') {
          // 小夜班: M=1, P=1, G=3, CT=3
          if (role === 'm' || role === 'p') return 1;
          if (role === 'g' || role === 'ct') return 3;
        } else if (sType === 'night') {
          // 大夜班: M=2, P=1, G=3, CT=2
          if (role === 'm' || role === 'ct') return 2;
          if (role === 'g') return 3;
          if (role === 'p') return 1;
        }
        return 0;
      };

      // 一鍵儲存
      const handleSaveCurrentMonth = () => {
        try {
          const dataToSave = { schedule, lockedAssignments, assignments, stats, activeEmployeeIds };
          localStorage.setItem(`ShiftScheduler_data_${currentDate}`, JSON.stringify(dataToSave));
          alert(`${year} 年 ${month} 月排班資料已成功儲存！`);
        } catch (e) {
          alert("儲存失敗，請檢查瀏覽器設定。");
        }
      };

      // 匯出 CSV 功能 (針對當前選擇的班別)
      const handleExportCSV = () => {
        const currentAssignments = assignments[shiftType] || {};
        if (Object.keys(currentAssignments).length === 0) {
          alert('請先產生班表！');
          return;
        }

        const shiftName = shiftType === 'evening' ? '小夜班' : '大夜班';
        let csvContent = '\uFEFF';

        // --- 1. 橫式班表區塊 ---
        csvContent += `同仁 \\ 日期,`;
        for (let day = 1; day <= daysInMonth; day++) {
          csvContent += `${day}日,`;
        }
        csvContent += '\n';

        activeEmployees.forEach(emp => {
          let row = `${emp.name},`;
          for (let day = 1; day <= daysInMonth; day++) {
            const role = currentAssignments[day]?.[emp.id];
            row += role ? `${role.toUpperCase()},` : '休,';
          }
          csvContent += row + '\n';
        });

        csvContent += '\n\n'; // 空行分隔

        // --- 2. 統計與加給明細區塊 ---
        csvContent += '同仁,總天數,M,P,G,CT,F,總加給時數,加給明細\n';
        activeEmployees.forEach(emp => {
          const s = stats[shiftType][emp.id] || { total_shifts: 0, m: 0, p: 0, g: 0, ct: 0, f: 0 };
          const bonusInfo = getEmployeeBonusDetails(emp.id, shiftType);
          const detailsStr = bonusInfo.details
            .map(d => `${d.day}日(${d.role.toUpperCase()}:${d.hours}hr)`)
            .join(' | ');
          
          csvContent += `${emp.name},${s.total_shifts},${s.m},${s.p},${s.g},${s.ct},${s.f},${bonusInfo.totalHours} hr,${detailsStr || '無'}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', `${year}年${month}月_${shiftName}_排班表與加給明細.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 匯出圖片共用函式
      const exportAsImage = async (ref, filenameSuffix) => {
        if (!ref.current) return;
        try {
          const canvas = await html2canvas(ref.current, { 
            scale: 2, 
            backgroundColor: '#ffffff',
            useCORS: true
          });
          const image = canvas.toDataURL("image/png");
          const link = document.createElement("a");
          link.href = image;
          const shiftName = shiftType === 'evening' ? '小夜班' : '大夜班';
          link.download = `${year}年${month}月_${shiftName}_${filenameSuffix}.png`;
          link.click();
        } catch (error) {
          console.error("匯出圖片失敗", error);
          alert("匯出圖片失敗，請稍後再試。");
        }
      };

      const handleExportScheduleImage = () => exportAsImage(scheduleTableRef, '排班表');
      const handleExportStatsImage = () => exportAsImage(statsTableRef, '加給明細表');

      // 跨月統計邏輯 (合併小夜與大夜)
      const getMonthsInRange = (start, end) => {
        let current = new Date(start + '-01');
        let endDate = new Date(end + '-01');
        let months = [];
        while (current <= endDate) {
          let y = current.getFullYear();
          let m = String(current.getMonth() + 1).padStart(2, '0');
          months.push(`${y}-${m}`);
          current.setMonth(current.getMonth() + 1);
        }
        return months;
      };

      const generateMultiStats = () => {
        const months = getMonthsInRange(multiStartMonth, multiEndMonth);
        const agg = {};
        
        employeePool.forEach(emp => {
          agg[emp.id] = { name: emp.name, m: 0, p: 0, g: 0, ct: 0, f: 0, total_shifts: 0, bonusHours: 0, details: [] };
        });

        months.forEach(mStr => {
          try {
            const data = localStorage.getItem(`ShiftScheduler_data_${mStr}`);
            if (data) {
              const parsed = JSON.parse(data);
              const [yStr, moStr] = mStr.split('-');
              const y = parseInt(yStr);
              const mo = parseInt(moStr);
              const dInM = new Date(y, mo, 0).getDate();
              
              // 處理舊資料相容 (若無 evening/night 則視為 evening)
              const isOldFormat = !parsed.assignments?.evening && !parsed.assignments?.night;
              const typesToProcess = isOldFormat ? ['evening'] : ['evening', 'night'];

              typesToProcess.forEach(sType => {
                const mAssignments = isOldFormat ? (parsed.assignments || {}) : (parsed.assignments[sType] || {});
                
                for (let day = 1; day <= dInM; day++) {
                  const dayAssign = mAssignments[day] || {};
                  Object.entries(dayAssign).forEach(([empId, role]) => {
                    if (agg[empId]) {
                      agg[empId][role]++;
                      agg[empId].total_shifts++;
                      const hours = getRoleBonusHours(role, sType);
                      if (hours > 0) {
                        agg[empId].bonusHours += hours;
                        const shiftLabel = sType === 'evening' ? '小夜' : '大夜';
                        agg[empId].details.push({ month: mStr, day, role, hours, dayOfWeek: getDayOfWeek(y, mo, day), shiftLabel });
                      }
                    }
                  });
                }
              });
            }
          } catch (e) {}
        });
        setMultiStats(agg);
      };

      useEffect(() => {
        if (activeTab === 'multi-stats') {
          generateMultiStats();
        }
      }, [activeTab, multiStartMonth, multiEndMonth]);

      // 員工池操作
      const handleAddEmployee = () => {
        if (!newEmpName.trim()) return;
        setEmployeePool(prev => [...prev, { id: 'emp_' + Date.now(), name: newEmpName.trim(), roles: { m: true, p: true, g: true, ct: true, f: true } }]);
        setNewEmpName('');
      };

      const handleDeleteEmployee = (id) => {
        if (confirm('確定要從員工池刪除此同仁嗎？')) {
          setEmployeePool(prev => prev.filter(e => e.id !== id));
          setActiveEmployeeIds(prev => prev.filter(eId => eId !== id));
        }
      };

      const toggleRoleInPool = (empId, roleKey) => {
        setEmployeePool(prev => prev.map(emp => emp.id === empId ? { ...emp, roles: { ...emp.roles, [roleKey]: !emp.roles[roleKey] } } : emp));
      };

      const toggleActiveEmployee = (id) => {
        setActiveEmployeeIds(prev => {
          if (prev.includes(id)) return prev.filter(eId => eId !== id);
          if (prev.length >= 6) { alert('每個月最多只能選擇 6 位同仁參與排班！'); return prev; }
          return [...prev, id];
        });
      };

      const moveEmployeeUp = (index) => {
        setActiveEmployeeIds(prev => {
          if (index === 0) return prev;
          const newIds = [...prev];
          [newIds[index - 1], newIds[index]] = [newIds[index], newIds[index - 1]];
          return newIds;
        });
      };

      const moveEmployeeDown = (index) => {
        setActiveEmployeeIds(prev => {
          if (index === prev.length - 1) return prev;
          const newIds = [...prev];
          [newIds[index + 1], newIds[index]] = [newIds[index], newIds[index + 1]];
          return newIds;
        });
      };

      const toggleWorkStatus = (day, empId) => {
        setSchedule(prev => {
          const daySchedule = prev[shiftType][day] || [];
          let newDaySchedule;
          if (daySchedule.includes(empId)) {
            // 移除上班，同時移除鎖定
            setLockedAssignments(lPrev => {
              const newLocks = { ...lPrev };
              if (newLocks[shiftType][day]) {
                const dayLocks = { ...newLocks[shiftType][day] };
                delete dayLocks[empId];
                newLocks[shiftType] = { ...newLocks[shiftType], [day]: dayLocks };
              }
              return newLocks;
            });
            newDaySchedule = daySchedule.filter(id => id !== empId);
          } else {
            if (daySchedule.length >= 5) return prev;
            newDaySchedule = [...daySchedule, empId];
          }
          return { ...prev, [shiftType]: { ...prev[shiftType], [day]: newDaySchedule } };
        });
      };

      const handleLockRole = (day, empId, role) => {
        setLockedAssignments(prev => {
          const newLocks = { ...prev };
          const shiftLocks = { ...(newLocks[shiftType] || {}) };
          const dayLocks = { ...(shiftLocks[day] || {}) };
          
          if (role === 'auto') delete dayLocks[empId];
          else dayLocks[empId] = role;
          
          shiftLocks[day] = dayLocks;
          newLocks[shiftType] = shiftLocks;
          return newLocks;
        });
      };

      const generateSchedule = () => {
        if (activeEmployees.length !== 6) return alert(`目前已選 ${activeEmployees.length} 人。請先至「0. 員工池設定」勾選剛好 6 位同仁參與本月排班！`);
        
        let newAssignments = {};
        let newStats = {};
        activeEmployees.forEach(emp => { newStats[emp.id] = { m: 0, p: 0, g: 0, ct: 0, f: 0, weekend_p: 0, weekend_ct: 0, total_shifts: 0 }; });
        const shuffle = (array) => array.sort(() => Math.random() - 0.5);

        const currentSchedule = schedule[shiftType] || {};
        const currentLocks = lockedAssignments[shiftType] || {};

        for (let day = 1; day <= daysInMonth; day++) {
          const weekend = isWeekend(year, month, day);
          const workingIds = currentSchedule[day] || [];
          let unassigned = [...workingIds];
          let dayAssign = {};
          workingIds.forEach(id => newStats[id].total_shifts++);
          let rolesToAssign = workingIds.length === 5 ? ['m', 'p', 'g', 'ct', 'f'] : ['m', 'p', 'g', 'ct'];

          const locks = currentLocks[day] || {};
          for (const [empId, lockedRole] of Object.entries(locks)) {
            if (unassigned.includes(empId)) {
              dayAssign[empId] = lockedRole;
              unassigned = unassigned.filter(id => id !== empId);
              const roleIdx = rolesToAssign.indexOf(lockedRole);
              if (roleIdx !== -1) rolesToAssign.splice(roleIdx, 1);
              newStats[empId][lockedRole]++;
              if (weekend && (lockedRole === 'ct' || lockedRole === 'p')) newStats[empId][`weekend_${lockedRole}`]++;
            }
          }

          shuffle(rolesToAssign);
          rolesToAssign.sort((r1, r2) => {
            const count1 = unassigned.filter(id => activeEmployees.find(e => e.id === id).roles[r1]).length;
            const count2 = unassigned.filter(id => activeEmployees.find(e => e.id === id).roles[r2]).length;
            return count1 - count2;
          });

          for (const role of rolesToAssign) {
            let candidates = unassigned.filter(id => activeEmployees.find(e => e.id === id).roles[role]);
            if (candidates.length === 0) return alert(`排班失敗！第 ${day} 天無人可排「${role.toUpperCase()}」。`);
            shuffle(candidates);
            candidates.sort((a, b) => newStats[a][role] - newStats[b][role]);
            const selectedEmp = candidates[0];
            dayAssign[selectedEmp] = role;
            newStats[selectedEmp][role]++;
            if (weekend && (role === 'ct' || role === 'p')) newStats[selectedEmp][`weekend_${role}`]++;
            unassigned = unassigned.filter(id => id !== selectedEmp);
          }
          newAssignments[day] = dayAssign;
        }
        
        setAssignments(prev => ({ ...prev, [shiftType]: newAssignments }));
        setStats(prev => ({ ...prev, [shiftType]: newStats }));
        setActiveTab('result');
      };

      const getEmployeeBonusDetails = (empId, sType) => {
        const details = [];
        let totalHours = 0;
        const currentAssignments = assignments[sType] || {};
        
        for (let day = 1; day <= daysInMonth; day++) {
          const role = currentAssignments[day]?.[empId];
          if (role) {
            const hours = getRoleBonusHours(role, sType);
            if (hours > 0) {
              details.push({ day, role, hours });
              totalHours += hours;
            }
          }
        }
        return { details, totalHours };
      };

      const getRoleColor = (role) => {
        switch(role) {
          case 'm': return 'bg-blue-100 text-blue-800 border-blue-200';
          case 'p': return 'bg-green-100 text-green-800 border-green-200';
          case 'g': return 'bg-purple-100 text-purple-800 border-purple-200';
          case 'ct': return 'bg-red-100 text-red-800 border-red-200';
          case 'f': return 'bg-yellow-100 text-yellow-800 border-yellow-200';
          default: return 'bg-gray-100 text-gray-400 border-gray-200';
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 p-4 md:p-6 font-sans relative">
          <div className="max-w-6xl mx-auto space-y-6">
            
            {/* Header */}
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
              <div>
                <h1 className="text-2xl font-bold text-gray-800 flex items-center">
                  <IconCalendar className="w-6 h-6 mr-2 text-indigo-600" />
                  {year} 年 {month} 月 工作職責排班系統
                </h1>
                <div className="flex items-center mt-3 gap-4">
                  <div className="flex items-center">
                    <label className="text-sm text-gray-600 mr-2 font-medium">排班月份：</label>
                    <input type="month" value={currentDate} onChange={handleMonthChange} className="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                  </div>
                  
                  {/* 班別切換 */}
                  <div className="flex bg-gray-100 p-1 rounded-lg">
                    <button 
                      onClick={() => setShiftType('evening')} 
                      className={`flex items-center px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${shiftType === 'evening' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                    >
                      <IconSun className="w-4 h-4 mr-1.5" /> 小夜班
                    </button>
                    <button 
                      onClick={() => setShiftType('night')} 
                      className={`flex items-center px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${shiftType === 'night' ? 'bg-indigo-600 text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                    >
                      <IconMoon className="w-4 h-4 mr-1.5" /> 大夜班
                    </button>
                  </div>
                </div>
              </div>
              
              <div className="flex flex-wrap items-center gap-3">
                <div className="flex bg-gray-100 p-1 rounded-lg overflow-x-auto custom-scrollbar">
                  <button onClick={() => setActiveTab('pool')} className={`px-3 py-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors ${activeTab === 'pool' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}>0. 員工池</button>
                  <button onClick={() => setActiveTab('input')} className={`px-3 py-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors ${activeTab === 'input' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}>1. 排休設定</button>
                  <button onClick={() => setActiveTab('result')} className={`px-3 py-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors ${activeTab === 'result' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}>2. 檢視結果</button>
                  <button onClick={() => setActiveTab('multi-stats')} className={`px-3 py-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors ${activeTab === 'multi-stats' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}>3. 跨月統計</button>
                </div>
              </div>
            </div>

            {/* Tab 0: Employee Pool */}
            {activeTab === 'pool' && (
              <div className="space-y-6 fade-in">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                    <div>
                      <h2 className="text-lg font-semibold text-gray-800 flex items-center"><IconUsers className="w-5 h-5 mr-2 text-indigo-500" />全域員工池與本月排班名單</h2>
                      <p className="text-sm text-gray-500 mt-1">請勾選剛好 <strong className="text-indigo-600">6 位</strong> 參與 {month} 月排班。(小夜/大夜共用此名單)</p>
                    </div>
                    <div className="flex items-center bg-indigo-50 px-4 py-2 rounded-lg border border-indigo-100">
                      <span className="text-sm font-medium text-indigo-800 mr-2">本月已選人數：</span>
                      <span className={`text-lg font-bold ${activeEmployeeIds.length === 6 ? 'text-green-600' : 'text-red-500'}`}>{activeEmployeeIds.length} / 6</span>
                    </div>
                  </div>
                  <div className="flex gap-2 mb-6">
                    <input type="text" value={newEmpName} onChange={(e) => setNewEmpName(e.target.value)} placeholder="輸入新同仁名稱..." className="flex-1 max-w-xs border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    <button onClick={handleAddEmployee} className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center text-sm font-medium shadow-sm"><IconUserPlus className="w-4 h-4 mr-1.5" />新增同仁</button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {employeePool.map(emp => {
                      const isActive = activeEmployeeIds.includes(emp.id);
                      return (
                        <div key={emp.id} className={`relative p-4 rounded-xl border-2 transition-all ${isActive ? 'bg-indigo-50/30 border-indigo-300 shadow-sm' : 'bg-white border-gray-200 hover:border-gray-300'}`}>
                          <div className="flex justify-between items-start mb-3">
                            <label className="flex items-center cursor-pointer group flex-1">
                              <input type="checkbox" className="hidden" checked={isActive} onChange={() => toggleActiveEmployee(emp.id)} />
                              <div className={`w-5 h-5 rounded border flex items-center justify-center mr-2 transition-colors ${isActive ? 'bg-indigo-500 border-indigo-500' : 'border-gray-300 group-hover:border-indigo-400'}`}>
                                {isActive && <IconCheckSquare className="w-4 h-4 text-white" />}
                              </div>
                              <span className={`font-medium ${isActive ? 'text-indigo-900' : 'text-gray-700'}`}>{emp.name}</span>
                            </label>
                            <button onClick={() => handleDeleteEmployee(emp.id)} className="text-gray-400 hover:text-red-500 transition-colors ml-2"><IconTrash className="w-4 h-4" /></button>
                          </div>
                          <div className="flex flex-wrap gap-2 mt-2">
                            {['m', 'p', 'g', 'ct', 'f'].map(role => (
                              <button key={role} onClick={() => toggleRoleInPool(emp.id, role)} className={`px-2 py-1 rounded text-xs font-medium border transition-colors ${emp.roles[role] ? 'bg-white border-gray-300 text-gray-700' : 'bg-gray-100 border-transparent text-gray-400'}`}>
                                {role.toUpperCase()} {emp.roles[role] && '✓'}
                              </button>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {activeEmployees.length > 0 && (
                    <div className="mt-8 pt-6 border-t border-gray-100">
                      <h3 className="text-md font-semibold text-gray-800 mb-4 flex items-center">
                        <IconList className="w-5 h-5 mr-2 text-indigo-500" />
                        排班名單順序調整
                        <span className="text-sm font-normal text-gray-500 ml-2">(將影響排休表與結果的顯示順序)</span>
                      </h3>
                      <div className="flex flex-col gap-2 max-w-sm">
                        {activeEmployees.map((emp, index) => (
                          <div key={emp.id} className="flex items-center justify-between bg-gray-50 p-3 rounded-lg border border-gray-200 shadow-sm">
                            <span className="font-medium text-gray-700">{index + 1}. {emp.name}</span>
                            <div className="flex gap-1">
                              <button onClick={() => moveEmployeeUp(index)} disabled={index === 0} className={`p-1.5 rounded transition-colors ${index === 0 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-indigo-100 hover:text-indigo-600'}`}><IconChevronUp className="w-5 h-5" /></button>
                              <button onClick={() => moveEmployeeDown(index)} disabled={index === activeEmployees.length - 1} className={`p-1.5 rounded transition-colors ${index === activeEmployees.length - 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-indigo-100 hover:text-indigo-600'}`}><IconChevronDown className="w-5 h-5" /></button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Tab 1: Input Schedule */}
            {activeTab === 'input' && (
              <div className="space-y-6 fade-in">
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                  <div className={`p-6 border-b flex flex-col md:flex-row justify-between items-start md:items-center gap-4 ${shiftType === 'night' ? 'bg-indigo-900 text-white' : 'bg-white border-gray-100'}`}>
                    <div>
                      <h2 className={`text-lg font-semibold flex items-center ${shiftType === 'night' ? 'text-white' : 'text-gray-800'}`}>
                        <IconSettings className={`w-5 h-5 mr-2 ${shiftType === 'night' ? 'text-indigo-300' : 'text-indigo-500'}`} />
                        {month} 月排休表輸入 ({shiftType === 'evening' ? '小夜班' : '大夜班'})
                      </h2>
                      <div className={`text-sm flex items-center mt-2 ${shiftType === 'night' ? 'text-indigo-200' : 'text-gray-500'}`}>勾選上班後，可手動鎖定當天職責</div>
                    </div>
                  </div>
                  <div className="overflow-x-auto custom-scrollbar">
                    <table className="w-full text-sm text-center">
                      <thead>
                        <tr className="bg-gray-50">
                          <th className="py-3 px-2 font-medium text-gray-600 border-b">日期</th>
                          <th className="py-3 px-2 font-medium text-gray-600 border-b">星期</th>
                          {activeEmployees.map(emp => <th key={emp.id} className="py-3 px-2 font-medium text-gray-600 border-b">{emp.name}</th>)}
                          <th className="py-3 px-2 font-medium text-gray-600 border-b">上班人數</th>
                        </tr>
                      </thead>
                      <tbody>
                        {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => {
                          const isWknd = isWeekend(year, month, day);
                          const workingCount = schedule[shiftType][day]?.length || 0;
                          const isValid = workingCount === 4 || workingCount === 5;
                          return (
                            <tr key={day} className={`border-b border-gray-50 hover:bg-gray-50 ${isWknd ? 'bg-red-50/30' : ''}`}>
                              <td className="py-3 px-2 font-medium text-gray-700">{month}/{day}</td>
                              <td className={`py-3 px-2 ${isWknd ? 'text-red-500' : 'text-gray-500'}`}>{getDayOfWeek(year, month, day)}</td>
                              {activeEmployees.map(emp => {
                                const isWorking = schedule[shiftType][day]?.includes(emp.id);
                                const lockedRole = lockedAssignments[shiftType][day]?.[emp.id] || 'auto';
                                return (
                                  <td key={emp.id} className="py-2 px-2">
                                    <div className="flex flex-col items-center gap-1.5">
                                      <button onClick={() => toggleWorkStatus(day, emp.id)} className={`w-8 h-8 rounded-md flex items-center justify-center transition-colors ${isWorking ? (shiftType === 'night' ? 'bg-indigo-800 text-white' : 'bg-indigo-500 text-white') : 'bg-gray-100 border border-gray-200'}`}>
                                        {isWorking && <IconCheckCircle className="w-5 h-5" />}
                                      </button>
                                      {isWorking ? (
                                        <select value={lockedRole} onChange={(e) => handleLockRole(day, emp.id, e.target.value)} className="text-xs rounded border outline-none cursor-pointer bg-transparent text-gray-500">
                                          <option value="auto">自動</option>
                                          <option value="m">M</option><option value="p">P</option><option value="g">G</option><option value="ct">CT</option>
                                          {workingCount === 5 && <option value="f">F</option>}
                                        </select>
                                      ) : <div className="h-5"></div>}
                                    </div>
                                  </td>
                                );
                              })}
                              <td className="py-3 px-2">
                                <span className={`inline-flex px-2 py-1 rounded-full text-xs font-medium ${isValid ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{workingCount} / 4~5</span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div className="p-6 bg-gray-50 border-t border-gray-100 flex justify-end">
                    <button onClick={generateSchedule} className={`px-6 py-3 text-white rounded-xl flex items-center font-medium shadow-sm transition-colors ${shiftType === 'night' ? 'bg-indigo-800 hover:bg-indigo-900' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                      <IconRefreshCw className="w-5 h-5 mr-2" />
                      執行自動分配 ({shiftType === 'evening' ? '小夜班' : '大夜班'})
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Tab 2: Result */}
            {activeTab === 'result' && (
              <div className="space-y-6 fade-in">
                {Object.keys(assignments[shiftType] || {}).length === 0 ? (
                  <div className="bg-white p-12 rounded-2xl shadow-sm border border-gray-100 text-center">
                    <h3 className="text-lg font-medium text-gray-900">尚未產生 {shiftType === 'evening' ? '小夜班' : '大夜班'} 班表</h3>
                  </div>
                ) : (
                  <>
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                      <div className="p-6 border-b border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
                        <h2 className="text-lg font-semibold text-gray-800 flex items-center">
                          <IconCalendar className="w-5 h-5 mr-2 text-indigo-500" />
                          {month} 月每日職責分配表 ({shiftType === 'evening' ? '小夜班' : '大夜班'})
                        </h2>
                        
                        <div className="flex gap-2 flex-wrap justify-end">
                          <button onClick={handleExportScheduleImage} className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors flex items-center text-sm font-medium shadow-sm">
                            <IconImage className="w-4 h-4 mr-2" /> 匯出班表圖片
                          </button>
                          <button onClick={handleExportCSV} className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors flex items-center text-sm font-medium shadow-sm">
                            <IconDownload className="w-4 h-4 mr-2" /> 匯出 CSV (試算表)
                          </button>
                          <button onClick={handleSaveCurrentMonth} className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center text-sm font-medium shadow-sm">
                            <IconDatabase className="w-4 h-4 mr-2" /> 一鍵儲存本月排班
                          </button>
                        </div>
                      </div>
                      <div className="overflow-x-auto custom-scrollbar p-4 bg-gray-50">
                        <div ref={scheduleTableRef} className="inline-block min-w-full bg-white p-4 rounded-xl shadow-sm">
                          <h3 className="text-lg font-bold text-center mb-4 text-gray-800">{year}年{month}月 {shiftType === 'evening' ? '小夜班' : '大夜班'} 職責分配表</h3>
                          <table className="w-max text-sm text-center border-collapse bg-white overflow-hidden mx-auto">
                            <thead>
                              <tr>
                                <th className="py-3 px-4 border-b border-r bg-gray-50 sticky left-0 z-10">同仁 \ 日期</th>
                                {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => (
                                  <th key={day} className={`py-2 px-2 border-b border-r min-w-[44px] ${isWeekend(year, month, day) ? 'bg-red-50 text-red-600' : 'bg-gray-50 text-gray-600'}`}>
                                    <div className="font-bold text-base">{day}</div>
                                    <div className="text-xs font-normal mt-0.5">{getDayOfWeek(year, month, day)}</div>
                                  </th>
                                ))}
                              </tr>
                            </thead>
                            <tbody>
                              {activeEmployees.map((emp, idx) => (
                                <tr key={emp.id} className={idx % 2 === 0 ? 'bg-white' : 'bg-gray-50/50'}>
                                  <td className="py-3 px-4 border-b border-r font-medium text-gray-800 bg-white sticky left-0 z-10">{emp.name}</td>
                                  {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(day => {
                                    const role = assignments[shiftType][day]?.[emp.id];
                                    return (
                                      <td key={day} className={`py-2 px-1 border-b border-r ${isWeekend(year, month, day) ? 'bg-red-50/10' : ''}`}>
                                        {role ? <span className={`inline-flex items-center justify-center w-8 h-8 rounded-md font-bold text-xs border ${getRoleColor(role)}`}>{role.toUpperCase()}</span> : <span className="text-gray-300 text-xs font-medium">休</span>}
                                      </td>
                                    );
                                  })}
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                      <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                        <h2 className="text-lg font-semibold text-gray-800 flex items-center">
                          <IconBarChart3 className="w-5 h-5 mr-2 text-indigo-500" />
                          本月職責與加給統計 ({shiftType === 'evening' ? '小夜班' : '大夜班'})
                        </h2>
                        <button onClick={handleExportStatsImage} className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors flex items-center text-sm font-medium shadow-sm">
                          <IconImage className="w-4 h-4 mr-2" /> 匯出明細圖片
                        </button>
                      </div>
                      <div className="overflow-x-auto custom-scrollbar">
                        <div ref={statsTableRef} className="inline-block min-w-full bg-white p-4 rounded-xl">
                          <h3 className="text-lg font-bold text-center mb-4 text-gray-800">{year}年{month}月 {shiftType === 'evening' ? '小夜班' : '大夜班'} 加給統計表</h3>
                          <table className="w-full text-sm text-left border">
                            <thead>
                              <tr className="bg-gray-50 text-gray-600 border-b">
                                <th className="py-3 px-4 font-medium border-r">同仁</th>
                                <th className="py-3 px-4 font-medium border-r">總天數</th>
                                <th className="py-3 px-4 font-medium text-blue-700 border-r">M</th>
                                <th className="py-3 px-4 font-medium text-green-700 border-r">P</th>
                                <th className="py-3 px-4 font-medium text-purple-700 border-r">G</th>
                                <th className="py-3 px-4 font-medium text-red-700 border-r">CT</th>
                                <th className="py-3 px-4 font-medium text-yellow-700 border-r">F</th>
                                <th className="py-3 px-4 font-bold text-indigo-700 bg-indigo-50 border-r">加給總時數</th>
                                <th className="py-3 px-4 font-medium" data-html2canvas-ignore>操作</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                              {activeEmployees.map(emp => {
                                const s = stats[shiftType][emp.id];
                                const bonusInfo = getEmployeeBonusDetails(emp.id, shiftType);
                                return (
                                  <tr key={emp.id} className="hover:bg-gray-50">
                                    <td className="py-3 px-4 font-medium text-gray-800 border-r">{emp.name}</td>
                                    <td className="py-3 px-4 border-r">{s.total_shifts} 天</td>
                                    <td className="py-3 px-4 border-r">{s.m}</td>
                                    <td className="py-3 px-4 border-r">{s.p}</td>
                                    <td className="py-3 px-4 border-r">{s.g}</td>
                                    <td className="py-3 px-4 border-r">{s.ct}</td>
                                    <td className="py-3 px-4 border-r">{s.f}</td>
                                    <td className="py-3 px-4 font-bold text-indigo-700 bg-indigo-50/50 border-r">{bonusInfo.totalHours} hr</td>
                                    <td className="py-3 px-4" data-html2canvas-ignore>
                                      <button onClick={() => setBonusModalEmpId(emp.id)} className="text-indigo-600 hover:text-indigo-800 text-xs font-medium flex items-center bg-indigo-50 px-2 py-1 rounded"><IconList className="w-3 h-3 mr-1" /> 查看明細</button>
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}

            {/* Tab 3: Multi-month Stats */}
            {activeTab === 'multi-stats' && (
              <div className="space-y-6 fade-in">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                    <div>
                      <h2 className="text-lg font-semibold text-gray-800 flex items-center">
                        <IconTrendingUp className="w-5 h-5 mr-2 text-indigo-500" />
                        跨月職責與加給統計 (小夜 + 大夜合併)
                      </h2>
                      <p className="text-sm text-gray-500 mt-1">選擇區間，系統將自動彙整所有已儲存的排班資料。</p>
                    </div>
                    <div className="flex items-center gap-2 bg-gray-50 p-2 rounded-lg border border-gray-200">
                      <input type="month" value={multiStartMonth} onChange={(e) => setMultiStartMonth(e.target.value)} className="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                      <span className="text-gray-500">至</span>
                      <input type="month" value={multiEndMonth} onChange={(e) => setMultiEndMonth(e.target.value)} className="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                    </div>
                  </div>

                  <div className="overflow-x-auto custom-scrollbar">
                    <table className="w-full text-sm text-left">
                      <thead>
                        <tr className="bg-indigo-50 text-indigo-900">
                          <th className="py-3 px-4 font-medium rounded-tl-lg">同仁</th>
                          <th className="py-3 px-4 font-medium">累計天數</th>
                          <th className="py-3 px-4 font-medium">M</th>
                          <th className="py-3 px-4 font-medium">P</th>
                          <th className="py-3 px-4 font-medium">G</th>
                          <th className="py-3 px-4 font-medium">CT</th>
                          <th className="py-3 px-4 font-medium">F</th>
                          <th className="py-3 px-4 font-bold text-indigo-700">跨月總加給</th>
                          <th className="py-3 px-4 font-medium rounded-tr-lg">詳細日期</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {Object.values(multiStats).filter(s => s.total_shifts > 0).length === 0 ? (
                          <tr><td colSpan="9" className="py-8 text-center text-gray-400">此區間內無已儲存的排班資料</td></tr>
                        ) : (
                          Object.entries(multiStats).filter(([_, s]) => s.total_shifts > 0).map(([empId, s]) => (
                            <tr key={empId} className="hover:bg-gray-50">
                              <td className="py-3 px-4 font-medium text-gray-800">{s.name}</td>
                              <td className="py-3 px-4">{s.total_shifts} 天</td>
                              <td className="py-3 px-4">{s.m}</td>
                              <td className="py-3 px-4">{s.p}</td>
                              <td className="py-3 px-4">{s.g}</td>
                              <td className="py-3 px-4">{s.ct}</td>
                              <td className="py-3 px-4">{s.f}</td>
                              <td className="py-3 px-4 font-bold text-indigo-700 bg-indigo-50/30">{s.bonusHours} hr</td>
                              <td className="py-3 px-4">
                                <button onClick={() => setMultiBonusModalEmpId(empId)} className="text-indigo-600 hover:text-indigo-800 text-xs font-medium flex items-center bg-indigo-50 px-2 py-1 rounded">
                                  <IconList className="w-3 h-3 mr-1" /> 跨月明細
                                </button>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* 單月加給明細 Modal */}
          {bonusModalEmpId && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm fade-in">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[80vh]">
                <div className="flex justify-between items-center p-5 border-b border-gray-100 bg-gray-50">
                  <h3 className="text-lg font-bold text-gray-800 flex items-center"><IconClock className="w-5 h-5 mr-2 text-indigo-500" />{activeEmployees.find(e => e.id === bonusModalEmpId)?.name} 的加給明細 ({shiftType === 'evening' ? '小夜班' : '大夜班'})</h3>
                  <button onClick={() => setBonusModalEmpId(null)} className="text-gray-400 hover:text-gray-600"><IconX className="w-5 h-5" /></button>
                </div>
                <div className="p-0 overflow-y-auto custom-scrollbar flex-1">
                  <table className="w-full text-sm text-center">
                    <thead className="sticky top-0 bg-white border-b border-gray-200">
                      <tr><th className="py-3 px-4">日期</th><th className="py-3 px-4">職責</th><th className="py-3 px-4">時數</th></tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100">
                      {getEmployeeBonusDetails(bonusModalEmpId, shiftType).details.map((item, idx) => (
                        <tr key={idx} className="hover:bg-gray-50">
                          <td className="py-3 px-4">{month}/{item.day} ({getDayOfWeek(year, month, item.day)})</td>
                          <td className="py-3 px-4"><span className={`inline-flex items-center justify-center w-6 h-6 rounded font-bold text-xs border ${getRoleColor(item.role)}`}>{item.role.toUpperCase()}</span></td>
                          <td className="py-3 px-4 font-medium text-indigo-600">+{item.hours} hr</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="p-4 border-t border-gray-100 bg-indigo-50 flex justify-between items-center">
                  <span className="font-medium text-indigo-800">總計加給時數</span>
                  <span className="text-xl font-bold text-indigo-700">{getEmployeeBonusDetails(bonusModalEmpId, shiftType).totalHours} 小時</span>
                </div>
              </div>
            </div>
          )}

          {/* 跨月加給明細 Modal */}
          {multiBonusModalEmpId && multiStats[multiBonusModalEmpId] && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm fade-in">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[80vh]">
                <div className="flex justify-between items-center p-5 border-b border-gray-100 bg-indigo-50">
                  <h3 className="text-lg font-bold text-indigo-900 flex items-center"><IconDatabase className="w-5 h-5 mr-2 text-indigo-600" />{multiStats[multiBonusModalEmpId].name} 跨月加給明細</h3>
                  <button onClick={() => setMultiBonusModalEmpId(null)} className="text-indigo-400 hover:text-indigo-600"><IconX className="w-5 h-5" /></button>
                </div>
                <div className="p-0 overflow-y-auto custom-scrollbar flex-1">
                  <table className="w-full text-sm text-center">
                    <thead className="sticky top-0 bg-white border-b border-gray-200 shadow-sm">
                      <tr><th className="py-3 px-4">年月</th><th className="py-3 px-4">班別</th><th className="py-3 px-4">日期</th><th className="py-3 px-4">職責</th><th className="py-3 px-4">時數</th></tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100">
                      {multiStats[multiBonusModalEmpId].details.length > 0 ? (
                        multiStats[multiBonusModalEmpId].details.map((item, idx) => (
                          <tr key={idx} className="hover:bg-gray-50">
                            <td className="py-3 px-4 text-gray-500">{item.month}</td>
                            <td className="py-3 px-4 text-gray-600 font-medium">
                              <span className={`px-2 py-1 rounded text-xs ${item.shiftLabel === '大夜' ? 'bg-indigo-100 text-indigo-800' : 'bg-orange-50 text-orange-600'}`}>{item.shiftLabel}</span>
                            </td>
                            <td className="py-3 px-4 text-gray-800">{item.day}日 ({item.dayOfWeek})</td>
                            <td className="py-3 px-4"><span className={`inline-flex items-center justify-center w-6 h-6 rounded font-bold text-xs border ${getRoleColor(item.role)}`}>{item.role.toUpperCase()}</span></td>
                            <td className="py-3 px-4 font-medium text-indigo-600">+{item.hours} hr</td>
                          </tr>
                        ))
                      ) : (
                        <tr><td colSpan="5" className="py-8 text-gray-400">此區間內無加給時數</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
                <div className="p-4 border-t border-gray-100 bg-indigo-100 flex justify-between items-center">
                  <span className="font-medium text-indigo-900">區間總計加給時數</span>
                  <span className="text-xl font-bold text-indigo-700">{multiStats[multiBonusModalEmpId].bonusHours} 小時</span>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ShiftSchedulerApp />);
  </script>
</body>
</html>
